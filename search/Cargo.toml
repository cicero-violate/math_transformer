[package]
name = "search"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoder = { path = "../encoder" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["std"] }
tempfile = "3"
walkdir = "2"
