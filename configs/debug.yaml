model:
  d_model: 32
  n_heads: 2
  n_layers: 1
  d_ff: 64
  dropout: 0.0
  topk: 1
  local_window: 0

training:
  batch_size: 1
  lr: 1.0e-3
  max_steps: 5
  warmup_steps: 0

data:
  path: data/examples.jsonl
  max_seq_len: 16

eval:
  interval: 1
  metrics:
    - op_accuracy
    - route_accuracy
    - sparsity_ratio
